name: Build Minecraft 1.21.11

on:
  push:
    branches:
      - mc-1.21.11
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew --no-daemon clean build

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: marlowwwclient-1.21.11
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
